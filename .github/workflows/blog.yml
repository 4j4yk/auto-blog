name: Publish blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Check the blog
        run: uv run python -m unittest discover -s tests -v
      - name: Generate today's article
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'gemini/gemini-3.5-flash-lite' }}
        run: uv run python blog.py generate
      - name: Save generated posts
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/
          if ! git diff --cached --quiet; then
            git commit -m "Add daily blog article"
            git push
          fi
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run python blog.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
