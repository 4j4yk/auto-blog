name: Publish blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * *'
    # Catch up if GitHub drops the first scheduled event. Generation is idempotent.
    - cron: '47 15,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Check the blog
        run: uv run python -m unittest discover -s tests -v
      - name: Generate today's article
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'gemini/gemini-3.5-flash-lite' }}
        run: uv run python blog.py generate
      - name: Stage generated posts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-posts
          path: posts
          if-no-files-found: error
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run python blog.py build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  save:
    if: github.event_name != 'push'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-posts
          path: generated-posts
      - name: Save generated post
        run: |
          cp -R generated-posts/. posts/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/
          if ! git diff --cached --quiet; then
            git commit -m "Add daily blog article"
            git push
          fi

  deploy:
    if: always() && needs.prepare.result == 'success' && (needs.save.result == 'success' || needs.save.result == 'skipped')
    needs: [prepare, save]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
